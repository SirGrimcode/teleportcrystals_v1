plugins {
    // Fabric recommended Loom 1.17 for 26.3 in their release notes, but
    // that lagged the actual latest published Maven artifact (1.18.2 at
    // time of writing) - and this number will keep moving. Using "1.+"
    // instead of a pinned number so it always resolves to the latest 1.x
    // release automatically, via the resolutionStrategy in settings.gradle
    // that routes this straight to the real net.fabricmc:fabric-loom
    // module rather than through marker-artifact lookup.
    id 'net.fabricmc.fabric-loom' version '1.+'
    id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

repositories {
    // Add extra repositories here if you pull in other mods' APIs.
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    // No "mappings(...)" line and no "modImplementation" - Minecraft is
    // unobfuscated as of 26.1, so there's nothing to remap.
    implementation "net.fabricmc:fabric-loader:${project.loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"
}

processResources {
    inputs.property "version", project.version

    filesMatching("fabric.mod.json") {
        expand "version": project.version
    }
}

tasks.withType(JavaCompile).configureEach {
    it.options.release = 25
}

java {
    withSourcesJar()
    sourceCompatibility = JavaVersion.VERSION_25
    targetCompatibility = JavaVersion.VERSION_25
}
